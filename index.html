<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eng. Malk Khalid All Banna | Security Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              maroon: 'rgb(var(--color-primary) / <alpha-value>)', // Dynamic Primary Color
              anthracite: 'rgb(var(--color-text-main) / <alpha-value>)',
              lavender: '#C8A2C8',
              'off-white': 'rgb(var(--color-bg-main) / <alpha-value>)',
              'card-bg': 'rgb(var(--color-bg-card) / <alpha-value>)',
            },
            fontFamily: {
              sans: ['Inter', 'Tajawal', 'Cairo', 'sans-serif'],
              display: ['Playfair Display', 'Tajawal', 'Cairo', 'serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'border-flow': 'borderFlow 3s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              borderFlow: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Primary Color (Pink): 219 39 119 (#db2777) */
        --color-primary: 219 39 119; 
        --color-text-main: 55 65 81; /* #374151 */
        --color-bg-main: 250 250 250; /* #FAFAFA */
        --color-bg-card: 255 255 255; /* #FFFFFF */
      }

      .dark {
        /* In dark mode, primary color stays same (or user adjusted), backgrounds change */
        --color-text-main: 229 231 235; /* #E5E7EB */
        --color-bg-main: 17 24 39; /* #111827 */
        --color-bg-card: 31 41 55; /* #1F2937 */
      }

      body {
        background-color: transparent;
        color: rgb(var(--color-text-main));
        overflow-x: hidden;
        transition: background-color 0.3s, color 0.3s;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #C8A2C8; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--color-primary)); 
      }
      
      .cyber-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(200, 162, 200, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(200, 162, 200, 0.05) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",

    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
